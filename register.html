<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | YogaSphere Member Portal</title>
  <meta name="description" content="Register for a YogaSphere membership. Select a package, create your account, and manage your yoga practice.">
  <script>
    if (localStorage.getItem("darkModeEnabled") === "true") {
      document.documentElement.classList.add("dark");
    }
    if (localStorage.getItem("rtlEnabled") === "true") {
      document.documentElement.dir = "rtl";
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            violet: {
              50: '#F6F5F9', // Dimmed white background
              100: '#EAE7F5',
              200: '#D5CFED',
              300: '#C0B7E5',
              400: '#A697DB',
              500: '#7E69CC',
              600: '#6355B7', // Dimmed elegant violet
              700: '#5245A0',
              850: '#44388A',
              900: '#342B6B',
            },
            slatecharcoal: '#0F0E13',
            alabaster: '#FFFFFF',
            offwhite: '#F6F5F9',
            lightgrey: '#F1F1F4',
            mediumgrey: '#94A3B8',
            darkgrey: '#374151'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <link class="icon-pack-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="font-sans bg-violet-50 text-slate-900 dark:bg-slatecharcoal dark:text-slate-100 transition-all duration-300 min-h-screen flex flex-col justify-between">

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center p-6 relative">
    <div class="max-w-xl w-full bg-white dark:bg-[#11131E] rounded-[2rem] shadow-sm p-8 md:p-10 border border-slate-200 dark:border-slate-800 hover:shadow-[0_10px_25px_rgba(99,85,183,0.15)] hover:border-violet-300 transition-all duration-300">
      
      <!-- Top Card Header -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
        <!-- Logo -->
        <h1 class="text-xl font-bold text-violet-605 dark:text-violet-400">
          <a href="index.html" class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-violet-606 dark:text-violet-400"><path d="M12 3a9 9 0 0 0-9 9v7a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H4v-2a8 8 0 0 1 16 0v2h-3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-7a9 9 0 0 0-9-9z"></path></svg>
            <span class="tracking-tight text-violet-606 dark:text-violet-400">Yoga<span class="font-normal text-black dark:text-slate-400">Sphere</span></span>
          </a>
        </h1>
        <!-- Toggles -->
        <div class="flex items-center gap-4 text-slate-500 dark:text-slate-200">
          <button id="theme-toggle" class="hover:text-violet-600 dark:hover:text-violet-400 transition" aria-label="Toggle Theme"><i class="bi bi-moon"></i></button>
          <button id="lang-toggle" class="hover:text-violet-600 dark:hover:text-violet-400 transition" aria-label="RTL Mode"><i class="bi bi-arrow-left-right"></i></button>
        </div>
      </div>

      <!-- Welcome message -->
      <div class="text-center mt-8 mb-6">
        <h2 class="text-3xl font-bold text-slate-900 dark:text-white font-serif">Join YogaSphere</h2>
        <p class="text-xs text-slate-500 dark:text-slate-405 mt-2">Create your account to start booking classes.</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" class="space-y-4 text-xs font-sans">
        
        <!-- Full Name (Full width) -->
        <div>
          <label for="register-name" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Full Name</label>
          <input type="text" id="register-name" class="w-full px-4 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white" placeholder="Enter your full name" required>
        </div>

        <!-- Email Address & Phone Number (Side-by-side) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="register-email" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
            <input type="email" id="register-email" class="w-full px-4 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white" placeholder="Enter your email address" required>
          </div>
          <div>
            <label for="register-phone" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Phone Number</label>
            <input type="tel" id="register-phone" class="w-full px-4 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white" placeholder="Enter your phone number">
          </div>
        </div>

        <!-- Password & Confirm Password (Side-by-side) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="register-password" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
            <div class="relative">
              <input type="password" id="register-password" class="w-full pl-4 pr-12 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white" placeholder="Enter password" required>
              <span class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-slate-405 select-none hover:text-violet-600" id="toggleRegPassBtn">
                <i class="bi bi-eye"></i>
              </span>
            </div>
          </div>
          <div>
            <label for="register-confirm" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Confirm Password</label>
            <input type="password" id="register-confirm" class="w-full px-4 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white" placeholder="Confirm password" required>
          </div>
        </div>

        <!-- Membership Plan (Dropdown) -->
        <div>
          <label for="register-plan" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Membership Plan</label>
          <select id="register-plan" class="w-full px-4 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white font-bold" required>
            <option value="none">Choose a plan...</option>
            <option value="basic">Basic ($49/mo)</option>
            <option value="standard">Standard ($89/mo)</option>
            <option value="premium">Premium ($149/mo)</option>
          </select>
          <!-- Info Note -->
          <div class="flex items-center gap-1.5 text-violet-600 dark:text-violet-400 mt-2 font-semibold text-[10px]">
            <i class="bi bi-info-circle-fill"></i>
            <span>You can change your plan later in your dashboard.</span>
          </div>
        </div>
        
        <!-- Agreement Checkbox -->
        <div class="flex items-start gap-2 pt-2">
          <input type="checkbox" id="terms-agree" required class="mt-0.5 rounded border-slate-300 dark:border-slate-750 text-violet-600 focus:ring-violet-600">
          <label for="terms-agree" class="text-slate-500 dark:text-slate-400 cursor-pointer select-none">
            I agree to the Terms of Service and Privacy Policy.
          </label>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" class="w-full py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl shadow-md transition-all text-xs uppercase tracking-wider">
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="relative flex py-5 items-center">
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
        <span class="flex-shrink mx-4 text-slate-400 font-bold uppercase text-[9px] tracking-widest">or sign up with</span>
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-2 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-900 py-3 rounded-xl w-full font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slatecharcoal transition-all text-[11px]">
          <i class="bi bi-google"></i> Google
        </button>
        <button class="flex items-center justify-center gap-2 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-900 py-3 rounded-xl w-full font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slatecharcoal transition-all text-[11px]">
          <i class="bi bi-apple"></i> Apple
        </button>
      </div>

      <!-- Redirection link -->
      <div class="text-center mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 text-[11px] font-sans text-slate-500 dark:text-slate-450">
        Already have an account? <a href="login.html" class="text-violet-605 dark:text-violet-400 font-bold hover:underline">Log in here</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById("registerForm");
      const toggleRegPassBtn = document.getElementById("toggleRegPassBtn");
      const passInput = document.getElementById("register-password");
      const planSelect = document.getElementById("register-plan");
      // Theme and RTL toggles are handled globally by main.js

      // Eye toggle password script
      if (toggleRegPassBtn) {
        toggleRegPassBtn.addEventListener('click', () => {
          if (passInput.type === 'password') {
            passInput.type = 'text';
            toggleRegPassBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
          } else {
            passInput.type = 'password';
            toggleRegPassBtn.innerHTML = '<i class="bi bi-eye"></i>';
          }
        });
      }

      // Check plan param selector from URL
      const urlParams = new URLSearchParams(window.location.search);
      const planParam = urlParams.get('plan');
      if (planParam && (planParam === 'basic' || planParam === 'standard' || planParam === 'premium')) {
        planSelect.value = planParam;
      }

      if (registerForm) {
        registerForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("register-name").value.trim();
          const email = document.getElementById("register-email").value.trim();
          const plan = planSelect.value;
          const password = passInput.value;
          const confirmPass = document.getElementById("register-confirm").value;

          if (password !== confirmPass) {
            showAlert("Passwords do not match.", null, "Registration Error");
            return;
          }

          // Mock registration session setting
          localStorage.setItem("userLoggedIn", "true");
          localStorage.setItem("userRole", "member");
          localStorage.setItem("userEmail", email);
          localStorage.setItem("userName", name);
          localStorage.setItem("userPlan", plan !== "none" ? plan.charAt(0).toUpperCase() + plan.slice(1) : "Basic");

          showAlert(`Welcome to YogaSphere, ${name}! Your account has been registered under the selected membership.`, () => {
            window.location.href = "dashboard-home.html";
          }, "Registration Success");
        });
      }
    });
  </script>
</body>
</html>
