<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | YogaSphere Portal</title>
  <meta name="description" content="Access your YogaSphere member portal. Book sessions, track history, and manage subscriptions.">
  <script>
    if (localStorage.getItem("darkModeEnabled") === "true") {
      document.documentElement.classList.add("dark");
    }
    if (localStorage.getItem("rtlEnabled") === "true") {
      document.documentElement.dir = "rtl";
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            violet: {
              50: '#F6F5F9', // Dimmed white background
              100: '#EAE7F5',
              200: '#D5CFED',
              300: '#C0B7E5',
              400: '#A697DB',
              500: '#7E69CC',
              600: '#6355B7', // Dimmed elegant violet
              700: '#5245A0',
              850: '#44388A',
              900: '#342B6B',
            },
            slatecharcoal: '#0F0E13',
            alabaster: '#FFFFFF',
            offwhite: '#F6F5F9',
            lightgrey: '#F1F1F4',
            mediumgrey: '#94A3B8',
            darkgrey: '#374151'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <link class="icon-pack-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="font-sans bg-violet-50 text-slate-900 dark:bg-slatecharcoal dark:text-slate-100 transition-all duration-300 min-h-screen flex flex-col justify-between">

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center p-6 relative">
    <div class="max-w-lg w-full bg-white dark:bg-[#11131E] rounded-[2rem] shadow-sm p-8 md:p-10 border border-slate-200 dark:border-slate-800 hover:shadow-[0_10px_25px_rgba(99,85,183,0.15)] hover:border-violet-300 transition-all duration-300">
      
      <!-- Top Card Header -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
        <!-- Logo -->
        <h1 class="text-xl font-bold text-violet-605 dark:text-violet-400">
          <a href="index.html" class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-violet-606 dark:text-violet-400"><path d="M12 3a9 9 0 0 0-9 9v7a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H4v-2a8 8 0 0 1 16 0v2h-3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-7a9 9 0 0 0-9-9z"></path></svg>
            <span class="tracking-tight text-violet-606 dark:text-violet-400">Yoga<span class="font-normal text-black dark:text-slate-400">Sphere</span></span>
          </a>
        </h1>
        <!-- Toggles -->
        <div class="flex items-center gap-4 text-slate-500 dark:text-slate-200">
          <button id="theme-toggle" class="hover:text-violet-600 dark:hover:text-violet-400 transition" aria-label="Toggle Theme"><i class="bi bi-moon"></i></button>
          <button id="lang-toggle" class="hover:text-violet-600 dark:hover:text-violet-400 transition" aria-label="RTL Mode"><i class="bi bi-arrow-left-right"></i></button>
        </div>
      </div>

      <!-- Welcome message -->
      <div class="text-center mt-8 mb-6">
        <h2 class="text-3xl font-bold text-slate-900 dark:text-white font-serif">Welcome Back</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">Sign in to continue to your account.</p>
      </div>



      <!-- Alert for validation errors -->
      <div id="login-error-alert" class="hidden p-4 bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-400 font-semibold text-xs rounded-2xl mb-6 flex items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill text-sm"></i>
        <span id="login-error-text">Invalid credentials. Please try again.</span>
      </div>

      <!-- Sign In Form -->
      <form id="loginForm" class="space-y-5 text-xs font-sans">
        <div>
          <label for="login-email" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Email Address</label>
          <input type="email" id="login-email" class="w-full px-4 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white" placeholder="Enter your email address" required>
        </div>
        
        <div>
          <label for="login-password" class="block font-bold text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <input type="password" id="login-password" class="w-full pl-4 pr-12 py-3 bg-white dark:bg-slatecharcoal border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white" placeholder="Enter your password" required>
            <span class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-slate-400 select-none hover:text-violet-600" id="togglePassBtn">
              <i class="bi bi-eye"></i>
            </span>
          </div>
        </div>
        
        <!-- Options Row -->
        <div class="flex items-center justify-between pt-1">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="remember-me" class="rounded border-slate-300 dark:border-slate-750 text-violet-600 focus:ring-violet-600">
            <label for="remember-me" class="text-slate-500 dark:text-slate-400 cursor-pointer select-none">Remember me</label>
          </div>
          <a href="#" class="text-slate-500 hover:text-violet-600 dark:hover:text-violet-400 font-semibold">Forgot Password?</a>
        </div>
        
        <button type="submit" class="w-full py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl shadow-md transition-all text-xs uppercase tracking-wider">
          Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="relative flex py-5 items-center">
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
        <span class="flex-shrink mx-4 text-slate-400 font-bold uppercase text-[9px] tracking-widest">or continue with</span>
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-2 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-900 py-3 rounded-xl w-full font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slatecharcoal transition-all text-[11px]">
          <i class="bi bi-google"></i> Google
        </button>
        <button class="flex items-center justify-center gap-2 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-900 py-3 rounded-xl w-full font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slatecharcoal transition-all text-[11px]">
          <i class="bi bi-apple"></i> Apple
        </button>
      </div>

      <!-- Redirection link -->
      <div class="text-center mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 text-[11px] font-sans text-slate-500 dark:text-slate-450">
        Don't have an account? <a href="register.html" class="text-violet-600 dark:text-violet-400 font-bold hover:underline">Register here</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById("loginForm");
      const errorAlert = document.getElementById("login-error-alert");
      const errorText = document.getElementById("login-error-text");
      const togglePassBtn = document.getElementById("togglePassBtn");
      const passInput = document.getElementById("login-password");
      // Theme and RTL toggles are handled globally by main.js

      // Eye toggle password script
      if (togglePassBtn) {
        togglePassBtn.addEventListener('click', () => {
          if (passInput.type === 'password') {
            passInput.type = 'text';
            togglePassBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
          } else {
            passInput.type = 'password';
            togglePassBtn.innerHTML = '<i class="bi bi-eye"></i>';
          }
        });
      }

      // Credentials submit checks
      if (loginForm) {
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          errorAlert.classList.add("hidden");

          const email = document.getElementById("login-email").value.trim();
          const pass = passInput.value;

          if (email === "sarah.mitchell@example.com" && pass === "user123") {
            localStorage.setItem("userLoggedIn", "true");
            localStorage.setItem("userRole", "member");
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userName", "Sarah Mitchell");
            window.location.href = "dashboard-home.html";
          } else if (email === "admin@yogasphere.com" && pass === "admin123") {
            localStorage.setItem("userLoggedIn", "true");
            localStorage.setItem("userRole", "admin");
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userName", "Administrator");
            window.location.href = "admin/dashboard.html";
          } else {
            errorText.textContent = "Invalid email address or password combination.";
            errorAlert.classList.remove("hidden");
          }
        });
      }
    });
  </script>
</body>
</html>
