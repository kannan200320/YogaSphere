<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="assets/images/favicon.png" type="image/png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings | YogaSphere</title>
  <script>
    if (localStorage.getItem("darkModeEnabled") === "true") {
      document.documentElement.classList.add("dark");
    }
    if (localStorage.getItem("rtlEnabled") === "true") {
      document.documentElement.dir = "rtl";
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            violet: {
              50: '#F6F5F9', // Dimmed white background
              100: '#EAE7F5',
              200: '#D5CFED',
              300: '#C0B7E5',
              400: '#A697DB',
              500: '#7E69CC',
              600: '#6355B7', // Dimmed elegant violet
              700: '#5245A0',
              850: '#44388A',
              900: '#342B6B',
            },
            slatecharcoal: '#0F0E13',
            alabaster: '#FFFFFF',
            offwhite: '#F6F5F9',
            lightgrey: '#F1F1F4',
            mediumgrey: '#94A3B8',
            darkgrey: '#374151'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>
  <link class="icon-pack-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="font-sans bg-violet-50 dark:bg-slatecharcoal text-slate-900 dark:text-slate-100 transition-all duration-300">

  <!-- Main Layout Wrapper -->
  <div class="min-h-screen flex flex-col">
    
    <!-- Top Header -->
    <header class="h-20 bg-white dark:bg-[#11131E] border-b border-slate-200 dark:border-slate-800 px-6 flex items-center justify-between z-30 sticky top-0 transition-colors">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-2 text-xl font-bold font-serif">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-violet-600 dark:text-violet-400"><path d="M12 3a9 9 0 0 0-9 9v7a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H4v-2a8 8 0 0 1 16 0v2h-3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-7a9 9 0 0 0-9-9z"></path></svg>
          <span class="tracking-tight text-violet-600 dark:text-violet-400">Yoga<span class="font-normal text-black dark:text-slate-400">Sphere</span></span>
        </a>
      </div>
      
      <div class="flex items-center gap-6 text-slate-500 dark:text-slate-200">
        <button id="lang-toggle" class="text-lg hover:text-violet-600 dark:hover:text-violet-400 transition" aria-label="Toggle RTL mode">
          <i class="bi bi-arrow-left-right"></i>
        </button>
        <button id="theme-toggle" class="text-lg hover:text-violet-600 dark:hover:text-violet-400 transition" aria-label="Toggle dark mode">
          <i class="bi bi-moon-fill"></i>
        </button>
        
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm font-serif shadow-inner" id="userAvatarText">
            SM
          </div>
          <span class="text-xs font-bold hidden sm:inline" id="userHeaderName">Sarah Mitchell</span>
        </div>
      </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row">
      <!-- Left Sidebar -->
      <aside class="w-full md:w-64 bg-white dark:bg-[#11131E] border-r border-slate-200 dark:border-slate-800 md:min-h-full p-6 space-y-8 flex-shrink-0 transition-colors">
        <div class="space-y-1">
          <p class="text-[10px] uppercase font-black text-slate-400 dark:text-slate-500 tracking-wider px-3 mb-3">Workspace</p>
          <nav class="space-y-1 list-none p-0 text-xs font-bold font-sans">
            <a href="dashboard-home.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-violet-50 dark:hover:bg-violet-950/20 text-slate-550 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-405 transition"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
            <a href="dashboard-book.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-violet-50 dark:hover:bg-violet-950/20 text-slate-550 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-405 transition"><i class="bi bi-calendar-plus-fill"></i> Book a Class</a>
            <a href="dashboard-history.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-violet-50 dark:hover:bg-violet-950/20 text-slate-550 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-405 transition"><i class="bi bi-clock-history"></i> Class History</a>
            <a href="dashboard-membership.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-violet-50 dark:hover:bg-violet-950/20 text-slate-550 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-405 transition"><i class="bi bi-credit-card-2-back-fill"></i> Membership</a>
            <a href="dashboard-profile.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-violet-50 dark:bg-violet-950/20 text-violet-600 dark:text-violet-405"><i class="bi bi-person-fill-gear"></i> Profile Settings</a>
          </nav>
        </div>
        <div class="pt-6 border-t border-slate-200 dark:border-slate-800">
          <button id="logoutBtn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-red-600 hover:bg-red-50 dark:hover:bg-red-950/20 transition text-left"><i class="bi bi-box-arrow-right"></i> Sign Out</button>
        </div>
      </aside>

      <!-- Main Dashboard Panel -->
      <main class="flex-1 p-6 md:p-8 relative">
        
        <!-- Skeleton Loader Screen -->
        <div id="skeleton-loader" class="space-y-6">
          <div class="h-80 bg-white dark:bg-[#11131E] rounded-3xl border border-slate-200 dark:border-slate-800 animate-pulse"></div>
        </div>

        <!-- Real Content Panel (Hidden Initially) -->
        <div id="real-content" class="hidden space-y-8">
          
          <!-- Page title -->
          <div>
            <h2 class="text-3xl font-bold font-serif text-slate-900 dark:text-white">Profile Settings</h2>
            <p class="text-xs text-slate-450 dark:text-slate-400 mt-1">Update your member credentials and contact preferences.</p>
          </div>

          <!-- Notification Toast Box -->
          <div id="profileNotification" class="hidden p-4 rounded-2xl text-xs font-bold transition-all duration-300"></div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Details Form -->
            <div class="lg:col-span-7 bg-white dark:bg-[#11131E] rounded-[2rem] border border-slate-200 dark:border-slate-800 p-6 md:p-8 shadow-sm space-y-6 hover:shadow-[0_10px_25px_rgba(99,85,183,0.15)] hover:border-violet-300 transition-all duration-300">
              <h4 class="text-lg font-bold font-serif text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-3">Personal Details</h4>
              
              <!-- Profile Picture Upload Section -->
              <div class="flex flex-col sm:flex-row items-center gap-6 pb-6 border-b border-slate-200 dark:border-slate-800">
                <div class="relative w-20 h-20 rounded-full border border-slate-200 dark:border-slate-700 bg-blue-600 text-white flex items-center justify-center font-bold text-2xl font-serif shadow-inner overflow-hidden" id="profilePicPreview">
                  SM
                </div>
                <div class="space-y-2 text-center sm:text-left">
                  <h5 class="text-sm font-bold text-slate-900 dark:text-white">Profile Photo</h5>
                  <p class="text-[10px] text-slate-450 dark:text-slate-500">Supported formats: JPG, PNG. Max size 2MB.</p>
                  <div class="flex flex-wrap justify-center sm:justify-start gap-2">
                    <button type="button" id="uploadPicBtn" class="px-4 py-2 bg-violet-600 hover:bg-violet-750 text-white font-bold rounded-xl shadow transition-all">Upload Photo</button>
                    <button type="button" id="removePicBtn" class="px-4 py-2 border border-slate-200 dark:border-slate-800 hover:border-violet-600 dark:hover:border-violet-400 text-slate-550 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 font-bold rounded-xl transition-all">Remove</button>
                    <input type="file" id="picInput" class="hidden" accept="image/*">
                  </div>
                </div>
              </div>

              <form id="profileForm" class="space-y-4 text-xs font-sans">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label for="profile-name" class="block font-bold text-slate-900 dark:text-white mb-2">Full Name *</label>
                    <input type="text" id="profile-name" class="w-full px-4 py-3 bg-violet-50 dark:bg-slatecharcoal border border-lightgrey dark:border-slate-850 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white text-xs" required>
                  </div>
                  <div>
                    <label for="profile-email" class="block font-bold text-slate-900 dark:text-white mb-2">Email Address *</label>
                    <input type="email" id="profile-email" class="w-full px-4 py-3 bg-violet-50 dark:bg-slatecharcoal border border-lightgrey dark:border-slate-850 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white text-xs" required>
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label for="profile-phone" class="block font-bold text-slate-900 dark:text-white mb-2">Phone Number</label>
                    <input type="tel" id="profile-phone" class="w-full px-4 py-3 bg-violet-50 dark:bg-slatecharcoal border border-lightgrey dark:border-slate-850 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white text-xs" placeholder="+1 (555) 964-2774" value="+1 (555) 964-2774">
                  </div>
                  <div>
                    <label for="profile-style" class="block font-bold text-slate-900 dark:text-white mb-2">Preferred Yoga Style</label>
                    <select id="profile-style" class="w-full px-4 py-3 bg-violet-50 dark:bg-slatecharcoal border border-lightgrey dark:border-slate-850 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white text-xs font-bold">
                      <option value="Hatha">Hatha Yoga</option>
                      <option value="Vinyasa" selected>Vinyasa Flow</option>
                      <option value="Yin">Yin Yoga</option>
                      <option value="Meditation">Mindful Meditation</option>
                    </select>
                  </div>
                </div>

                <div class="pt-4">
                  <button type="submit" class="px-6 py-3 bg-violet-600 hover:bg-violet-750 text-white font-bold rounded-xl shadow-md transition-all">Save Changes</button>
                </div>
              </form>
            </div>

            <!-- Password settings Form -->
            <div class="lg:col-span-5 bg-white dark:bg-[#11131E] rounded-[2rem] border border-slate-200 dark:border-slate-800 p-6 md:p-8 shadow-sm space-y-6 hover:shadow-[0_10px_25px_rgba(99,85,183,0.15)] hover:border-violet-300 transition-all duration-300">
              <h4 class="text-lg font-bold font-serif text-slate-900 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-3">Update Password</h4>
              
              <form id="passwordForm" class="space-y-4 text-xs font-sans">
                <div>
                  <label for="pass-current" class="block font-bold text-slate-900 dark:text-white mb-2">Current Password</label>
                  <input type="password" id="pass-current" class="w-full px-4 py-3 bg-violet-50 dark:bg-slatecharcoal border border-lightgrey dark:border-slate-850 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white text-xs" required placeholder="••••••••">
                </div>
                <div>
                  <label for="pass-new" class="block font-bold text-slate-900 dark:text-white mb-2">New Password</label>
                  <input type="password" id="pass-new" class="w-full px-4 py-3 bg-violet-50 dark:bg-slatecharcoal border border-lightgrey dark:border-slate-850 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white text-xs" required placeholder="Minimum 8 characters">
                </div>
                <div>
                  <label for="pass-confirm" class="block font-bold text-slate-900 dark:text-white mb-2">Confirm New Password</label>
                  <input type="password" id="pass-confirm" class="w-full px-4 py-3 bg-violet-50 dark:bg-slatecharcoal border border-lightgrey dark:border-slate-850 rounded-xl outline-none focus:border-violet-600 focus:ring-1 focus:ring-violet-600 text-slate-900 dark:text-white text-xs" required placeholder="••••••••">
                </div>

                <div class="pt-4">
                  <button type="submit" class="w-full py-3 bg-violet-605 border-2 border-violet-600 text-violet-600 dark:border-violet-400 dark:text-violet-400 hover:bg-violet-600 hover:text-white dark:hover:bg-violet-500 dark:hover:text-slatecharcoal font-bold rounded-xl transition-all">Update Password</button>
                </div>
              </form>
            </div>

          </div>

        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Validate logged in session
      const userLoggedIn = localStorage.getItem("userLoggedIn");
      const userRole = localStorage.getItem("userRole");
      const name = localStorage.getItem("userName") || "Sarah Mitchell";
      const email = localStorage.getItem("userEmail") || "sarah.mitchell@example.com";

      if (userLoggedIn !== "true" || userRole !== "member") {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("userHeaderName").textContent = name;
      
      // Profile Picture Handling
      const picInput = document.getElementById("picInput");
      const uploadPicBtn = document.getElementById("uploadPicBtn");
      const removePicBtn = document.getElementById("removePicBtn");
      const previewEl = document.getElementById("profilePicPreview");

      function updatePreview() {
        const currentName = localStorage.getItem("userName") || name;
        const avatarUrl = localStorage.getItem("userAvatarUrl");
        if (avatarUrl) {
          previewEl.innerHTML = `<img src="${avatarUrl}" class="w-full h-full rounded-full object-cover" alt="Preview">`;
        } else {
          const names = currentName.split(" ");
          const initials = names.length > 1 ? names[0].charAt(0) + names[1].charAt(0) : names[0].charAt(0);
          previewEl.textContent = initials.toUpperCase();
        }
        if (window.syncAvatar) {
          window.syncAvatar();
        }
      }

      if (uploadPicBtn && picInput) {
        uploadPicBtn.addEventListener("click", () => picInput.click());
        picInput.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (file) {
            if (file.size > 2 * 1024 * 1024) {
              showAlert("File size exceeds 2MB limit.", null, "Upload Error");
              return;
            }
            const reader = new FileReader();
            reader.onload = (event) => {
              localStorage.setItem("userAvatarUrl", event.target.result);
              updatePreview();
            };
            reader.readAsDataURL(file);
          }
        });
      }

      if (removePicBtn) {
        removePicBtn.addEventListener("click", () => {
          localStorage.removeItem("userAvatarUrl");
          picInput.value = "";
          updatePreview();
        });
      }

      updatePreview();

      // Pre-fill profile settings inputs
      const profileName = document.getElementById("profile-name");
      const profileEmail = document.getElementById("profile-email");
      profileName.value = name;
      profileEmail.value = email;

      const notification = document.getElementById("profileNotification");

      // Save changes handler
      document.getElementById("profileForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const updatedName = profileName.value.trim();
        const updatedEmail = profileEmail.value.trim();

        localStorage.setItem("userName", updatedName);
        localStorage.setItem("userEmail", updatedEmail);

        // Update headers dynamically
        updatePreview();

        notification.className = "p-4 rounded-2xl text-xs font-bold bg-green-605 text-white mb-4 bg-green-600";
        notification.innerHTML = '<i class="bi bi-check-circle-fill mr-1"></i> Personal details updated successfully.';
        notification.classList.remove("hidden");

        window.scrollTo({ top: 0, behavior: 'smooth' });

        setTimeout(() => {
          notification.classList.add("hidden");
        }, 4000);
      });

      // Update password handler
      document.getElementById("passwordForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const curPass = document.getElementById("pass-current").value;
        const newPass = document.getElementById("pass-new").value;
        const confPass = document.getElementById("pass-confirm").value;

        if (newPass !== confPass) {
          notification.className = "p-4 rounded-2xl text-xs font-bold bg-red-600 text-white mb-4";
          notification.innerHTML = '<i class="bi bi-exclamation-triangle-fill mr-1"></i> New passwords do not match.';
          notification.classList.remove("hidden");
          return;
        }

        if (newPass.length < 8) {
          notification.className = "p-4 rounded-2xl text-xs font-bold bg-red-600 text-white mb-4";
          notification.innerHTML = '<i class="bi bi-exclamation-triangle-fill mr-1"></i> Password must be at least 8 characters long.';
          notification.classList.remove("hidden");
          return;
        }

        notification.className = "p-4 rounded-2xl text-xs font-bold bg-green-605 text-white mb-4 bg-green-600";
        notification.innerHTML = '<i class="bi bi-check-circle-fill mr-1"></i> Password has been updated successfully.';
        notification.classList.remove("hidden");

        document.getElementById("passwordForm").reset();
        window.scrollTo({ top: 0, behavior: 'smooth' });

        setTimeout(() => {
          notification.classList.add("hidden");
        }, 4000);
      });

      // Disable skeleton loader after 600ms
      setTimeout(() => {
        document.getElementById("skeleton-loader").classList.add("hidden");
        document.getElementById("real-content").classList.remove("hidden");
      }, 600);

      // Logout handler
      document.getElementById("logoutBtn").addEventListener("click", () => {
        showConfirm("Sign out from your YogaSphere portal session?", () => {
          localStorage.removeItem("userLoggedIn");
          localStorage.removeItem("userRole");
          window.location.href = "login.html";
        });
      });
    });
  </script>
</body>
</html>
